users:
  get:
    summary: List all users
    operationId: listUsers
    tags:
      - Users
    security:
      - bearerAuth: []  # User authentication
      - oauth2ClientCredentials: ['governor:users:read']  # Service authentication with scope
    parameters:
      - name: deleted
        in: query
        description: Filter to show deleted users (true) or active users (false)
        required: false
        schema:
          type: boolean
          default: false
      - name: external_id
        in: query
        description: |
          Filter users by their external ID. With iss, it matches the external ID at that identity provider;
          without iss (deprecated), it matches the external ID at any identity provider.
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: iss
        in: query
        description: |
          Filter users by identity provider issuer. Alone, it matches the users with an identity at that
          issuer; with external_id, the users with that external ID there. Must be a configured oidc issuer.
        required: false
        schema:
          type: string
          format: uri
      - name: email
        in: query
        description: Filter users by their email address
        required: false
        schema:
          type: string
          format: email
      - name: metadata
        in: query
        description: |
          Filter users by metadata.
          this filter should be in the format of:
          ?metadata=key1=value&metadata=path.to.nested.field=value2
        required: false
        schema:
          type: string
          example: '?metadata=key1=value&metadata=path.to.nested.field=value2'
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: '../components/schemas/users.yaml#/User'
                - type: 'null'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

  post:
    summary: Create a new user
    operationId: createUser
    tags:
      - Users
    security:
      - bearerAuth: []  # User authentication (admin role required, checked internally)
      - oauth2ClientCredentials: ['governor:users:create']  # Service authentication with scope
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/users.yaml#/UserCreateRequest'
    responses:
      '202':  # Changed from 201 to 202 to match implementation that returns StatusAccepted
        description: User created and accepted
        content:
          application/json:
            schema:
              $ref: '../components/schemas/users.yaml#/User'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/BadRequest'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

users-id:
  get:
    summary: Get a user by ID
    operationId: getUser
    tags:
      - Users
    security:
      - bearerAuth: []
      - oauth2ClientCredentials: ['governor:users:read']
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: User ID (UUID) or email
    responses:
      '200':
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../components/schemas/users.yaml#/User'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

  put:
    summary: Update a user by ID
    operationId: updateUser
    tags:
      - Users
    security:
      - bearerAuth: []
      - oauth2ClientCredentials: ['governor:users:write']
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: User ID (UUID) or email
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/users.yaml#/UserUpdateRequest'
    responses:
      '202':  # Verified that 202 is correct (StatusAccepted)
        description: Successful response
        content:
          application/json:
            schema:
              $ref: '../components/schemas/users.yaml#/User'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        description: An external_ids entry is already linked to another user
        content:
          application/json:
            schema:
              $ref: '../components/schemas/errors.yaml#/Error'
      '422':
        $ref: '../components/responses.yaml#/UnprocessableEntity'
      '500':
        $ref: '../components/responses.yaml#/InternalError'

  delete:
    summary: Delete a user by ID
    operationId: deleteUser
    tags:
      - Users
    security:
      - bearerAuth: []
      - oauth2ClientCredentials: ['governor:users:delete']
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: User ID (UUID) or email
    responses:
      '202':  # Verified that 202 is correct (StatusAccepted)
        description: User successfully deleted
        content:
          application/json:
            schema:
              $ref: '../components/schemas/users.yaml#/User'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '500':
        $ref: '../components/responses.yaml#/InternalError'
